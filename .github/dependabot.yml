version: 2

updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # One pull request for routine patch bumps keeps review load sane; major
      # and minor bumps still arrive individually so they get read.
      rust-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
