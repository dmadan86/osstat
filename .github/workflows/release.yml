name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel need separate builds; macos-latest is arm64.
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-13
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'
          # Built on the oldest supported Ubuntu so the AppImage and .deb link
          # against a glibc old enough for other distributions.
          - os: ubuntu-22.04
            label: Linux
            args: ''
          - os: windows-latest
            label: Windows
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add Apple target
        if: startsWith(matrix.os, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing. Releases are unsigned until these secrets exist; see
          # docs for how to obtain them. Unsigned builds still install, with an
          # OS warning.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'osstat __VERSION__'
          releaseBody: 'See CHANGELOG.md for what changed. Verify downloads against SHA256SUMS.txt.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publishing checksums is only meaningful alongside signed artifacts, but
      # it lets people verify a download was not corrupted or swapped in transit.
      - name: Generate SHA256SUMS for the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p artifacts && cd artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || {
            echo "No assets found for $TAG"; exit 1;
          }
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
