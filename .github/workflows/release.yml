name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel need separate builds; macos-latest is arm64.
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-13
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'
          # Built on the oldest supported Ubuntu so the AppImage and .deb link
          # against a glibc old enough for other distributions.
          - os: ubuntu-22.04
            label: Linux
            args: ''
          - os: windows-latest
            label: Windows
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add Apple target
        if: startsWith(matrix.os, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Code signing is opt-in, and opting in means having the secrets.
      #
      # Setting the Apple variables unconditionally does not produce an
      # unsigned build on a repository without them: GitHub substitutes an
      # empty string, the bundler sees the variable as *set*, and codesigning
      # fails at `security import` with an empty certificate. The first real
      # release attempt failed exactly this way. Exporting them only when a
      # certificate exists is what actually makes signing optional.
      - name: Configure Apple code signing
        if: startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          {
            echo "APPLE_CERTIFICATE<<__OSSTAT_EOF__"
            echo "$CERTIFICATE"
            echo "__OSSTAT_EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'osstat __VERSION__'
          releaseBody: 'See CHANGELOG.md for what changed. Verify downloads against SHA256SUMS.txt.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Publishing checksums is only meaningful alongside signed artifacts, but
      # it lets people verify a download was not corrupted or swapped in transit.
      - name: Generate SHA256SUMS for the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p artifacts && cd artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || {
            echo "No assets found for $TAG"; exit 1;
          }
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
