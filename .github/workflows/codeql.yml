name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published advisories are caught without a code change.
    - cron: '17 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rust is covered by clippy with `-D warnings` and `cargo audit` in
        # ci.yml rather than here. Add 'rust' to this matrix once its CodeQL
        # support is worth the extra runner minutes.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
