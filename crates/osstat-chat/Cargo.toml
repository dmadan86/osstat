[package]
name = "osstat-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Running a local llama.cpp server and talking to it"

[dependencies]
osstat-core = { workspace = true }
osstat-llm = { workspace = true }
osstat-platform = { workspace = true }
osstat-inference = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Already in Cargo.lock through Tauri and osstat-inference; no new HTTP stack.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "stream",
  "json",
] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
