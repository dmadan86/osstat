[package]
name = "osstat-inference"
description = "Acquires and verifies the llama.cpp server runtime for osstat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
# Derives `ts_rs::TS` on the types that cross the IPC boundary so `cargo test
# --features ts-bindings` regenerates ui/src/bindings/ (ADR-002), the same
# convention osstat-llm and osstat-platform use.
ts-bindings = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }
# reqwest and tokio are already in Cargo.lock through Tauri, so this is the
# first code in osstat to make a network request but not the first network
# stack in the tree. `rustls` rather than the default so no system OpenSSL is
# needed on any of the three platforms. `http2` because GitHub release
# downloads redirect to a host that negotiates it.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
  "http2",
] }
sha2 = "0.10"
osstat-platform = { workspace = true }
# Upstream ships .zip on Windows and .tar.gz elsewhere, so both readers are
# needed. `deflate` only: no other compression method appears in the release.
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# `time` for the backoff between download attempts; see `RETRY_BACKOFF`.
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = { version = "0.3", default-features = false }
# Free disk space, before committing to a download that can be 642 MB. Chosen
# over reusing osstat-platform's sysinfo: fs4 wraps GetDiskFreeSpaceExW and
# statvfs directly, where sysinfo would mean matching a path against a list of
# mount points by hand — real code with real edge cases on every platform.
fs4 = "1.1.0"

[dev-dependencies]
tempfile = "3"
# `test-util` so the retry tests can advance past the backoff rather than
# spending 21 real seconds waiting it out.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# Validates the pinned manifest against its own JSON Schema in a test, rather
# than trusting that the schema and the data never drift apart. Same convention
# as osstat-llm's model registry.
jsonschema = "0.49"

[lints]
workspace = true
