[package]
name = "osstat-platform"
description = "Per-OS implementations of the osstat core capability traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
ts-bindings = ["dep:ts-rs", "osstat-core/ts-bindings"]

[dependencies]
netstat2 = "0.11.2"
osstat-core = { workspace = true }
serde = { workspace = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network", "user"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
serde_json = { workspace = true }
tempfile = "3"

# Posting WM_CLOSE is the only part of ending a process with no safe wrapper
# anywhere in the ecosystem. Already in Cargo.lock via wgpu, so this adds
# nothing to the licence surface.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# The M1 gate from ROADMAP.md: a 500-process refresh under 50 ms.
[[bench]]
name = "process_refresh"
harness = false

[lints]
workspace = true
