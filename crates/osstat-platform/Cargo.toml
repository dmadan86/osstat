[package]
name = "osstat-platform"
description = "Per-OS implementations of the osstat core capability traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
ts-bindings = ["dep:ts-rs", "osstat-core/ts-bindings"]

[dependencies]
osstat-core = { workspace = true }
serde = { workspace = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network", "user"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
