[package]
name = "osstat-llm"
description = "Hardware probe and LLM runnability advisor for osstat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
# Derives `ts_rs::TS` on the registry and calculator types so `cargo test
# --features ts-bindings` regenerates ui/src/bindings/ (ADR-002), the same
# convention osstat-platform uses.
ts-bindings = ["dep:ts-rs", "osstat-core/ts-bindings"]

[dependencies]
osstat-core = { workspace = true }
# The per-OS memory probes live here, not in this crate: osstat-llm forbids
# unsafe code, and DXGI and PDH are raw FFI. ADR-003 puts per-OS work in
# osstat-platform anyway; this crate keeps the portable merge.
osstat-platform = { workspace = true }
serde = { workspace = true }
# The seed registry ships as JSON, not Rust structs (ROADMAP.md M4: "the
# registry is data, not code"), so parsing it is a runtime dependency here,
# not just a dev one.
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
# Adapter enumeration only — osstat never renders anything. ADR-008 calls wgpu
# "a heavy dependency for what is ultimately adapter enumeration" and asks for
# its installer cost to be measured; see docs/measurements.md.
wgpu = { version = "27.0.1", default-features = false, features = [
  "dx12",
  "metal",
  "vulkan",
] }

# NVML ships with the NVIDIA driver on Windows and Linux. Apple has not shipped
# an NVIDIA driver since macOS 10.13, so linking it there would add weight for a
# code path that can never run.
[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = "0.12.1"

[dev-dependencies]
# Validates the seed registry against its own JSON Schema in a test, rather
# than trusting that the schema and the data never drift apart.
jsonschema = "0.49"

[lints]
workspace = true
