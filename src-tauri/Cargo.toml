[package]
name = "osstat"
description = "Cross-platform system cleaner, inspector and LLM runnability advisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
default-run = "osstat"

[lib]
# The app is a library so `main.rs` stays a thin wrapper and the command layer
# is unit-testable. Only `lib` is needed: mobile targets are an explicit
# non-goal, so the staticlib/cdylib artifacts Tauri's mobile template adds
# would be dead build time.
name = "osstat_lib"
crate-type = ["lib"]

[features]
default = []
# Regenerates ui/src/bindings/ under `cargo test --features ts-bindings`
# (ADR-002). Never enabled for a shipped build.
ts-bindings = [
  "dep:ts-rs",
  "osstat-chat/ts-bindings",
  "osstat-core/ts-bindings",
  "osstat-inference/ts-bindings",
  "osstat-llm/ts-bindings",
  "osstat-platform/ts-bindings",
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
osstat-chat = { workspace = true }
osstat-core = { workspace = true }
osstat-inference = { workspace = true }
osstat-llm = { workspace = true }
osstat-platform = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Already in Cargo.lock through Tauri itself; `sync` for the one-shot channel
# that stops a reply, `macros` for the `select!` that watches it.
tokio = { version = "1", features = ["sync", "macros"] }
# Logging. `tracing` itself is already in Cargo.lock through Tauri.
tracing = "0.1"
# `default-features = false` deliberately: it drops `ansi`, so no escape codes
# are ever written, and `tracing-log`, so no dependency's `log` records are
# picked up. The second matters — reqwest and hyper log URLs, and the point of
# this feature is that a log carries no user data.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "registry",
  "std",
] }
tracing-appender = "0.2"
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
