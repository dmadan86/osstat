[workspace]
resolver = "3"
members = ["crates/osstat-core", "crates/osstat-platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dmadan86/osstat"
homepage = "https://github.com/dmadan86/osstat"
authors = ["osstat contributors"]

[workspace.dependencies]
osstat-core = { path = "crates/osstat-core", version = "0.1.0" }
osstat-platform = { path = "crates/osstat-platform", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

# Lints are declared once here and inherited by every member via
# `[lints] workspace = true`. CI runs clippy with `-D warnings`, so anything
# set to "warn" below is effectively a hard failure on a pull request.
[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# ADR: no `unwrap`/`expect`/`panic` outside tests. Test modules opt out locally.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Release profile tuned for the <20 MB installer budget in the product goals.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
